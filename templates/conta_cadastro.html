{% extends "base.html" %}
{% block title %}Criar conta — Voxxel{% endblock %}
{% block content %}

<section style="padding-top:var(--space-3);">
  <div class="wrap" style="max-width:440px; margin:0 auto;">
    <div class="section-head fade-up" style="margin-bottom:var(--space-2);">
      <div class="eyebrow">Minha conta</div>
      <h2>Criar conta</h2>
      <p>Leva menos de um minuto — depois é só usar seu telefone e senha para entrar.</p>
    </div>

    <form method="post" class="form-card fade-up">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
      <div class="field">
        <label>Nome</label>
        <input type="text" name="nome" required placeholder="Seu nome" value="{{ request.form.get('nome','') }}">
      </div>
      <div class="field">
        <label>WhatsApp / telefone</label>
        <input type="text" name="telefone" required placeholder="(41) 9XXXX-XXXX" value="{{ request.form.get('telefone','') }}">
      </div>
      <div class="field">
        <label>Senha (mínimo 6 caracteres)</label>
        <input type="password" name="senha" required minlength="6">
      </div>
      <div class="field">
        <label>Confirmar senha</label>
        <input type="password" name="confirmar_senha" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Criar conta</button>
    </form>

    <p style="text-align:center; margin-top:18px; color:var(--muted); font-size:.9rem;">
      Já tem conta?
      <a href="{{ url_for('conta_entrar', next=request.args.get('next','')) }}" style="color:var(--gold-soft);">Entrar</a>
    </p>
  </div>
</section>

{% endblock %}
