{% extends "base.html" %}
{% block title %}{{ titulo }} — Voxxel{% endblock %}
{% block content %}
<section class="error-page">
  <div class="wrap error-page-inner">
    <div class="eyebrow">{{ codigo }}</div>
    <h1>{{ titulo }}</h1>
    <p>{{ mensagem }}</p>
    <div class="error-actions">
      <a class="btn btn-primary" href="{{ url_for('home') }}">Voltar para a Voxxel</a>
      <a class="btn btn-secondary" href="{{ url_for('loja') }}">Ver catálogo</a>
    </div>
  </div>
</section>
{% endblock %}
